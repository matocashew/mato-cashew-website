# MATO CASHEW - PRODUCTION CMS
# GitHub OAuth authentication via Cloudflare Worker.

local_backend: false
backend:
  name: github
  repo: matocashew/mato-cashew-website
  branch: main
  base_url: https://cms-auth.matocashew.com
  auth_endpoint: /auth

publish_mode: editorial_workflow

media_folder: "/public/images/news"
public_folder: "/images/news"

collections:
  - name: "news_en"
    sortable_fields:
      - field: publishedAt
        label: "Published Date"
        default_sort: desc
      - title
    label: "News & Events - English"
    folder: "src/content/news"
    create: true
    preview: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    fields:
      - {label: "Slug", name: "slug", widget: "string", hint: "Lowercase English letters, numbers and hyphens. Used for filename."}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Language", name: "language", widget: "hidden", default: "en"}
      - {label: "Translation Key", name: "translationKey", widget: "string"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Published Date", name: "publishedAt", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
      - {label: "Event Date", name: "eventDate", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false}
      - {label: "Source Name", name: "sourceName", widget: "string"}
      - {label: "Source URL", name: "sourceUrl", widget: "string"}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false, hint: "Use WebP only."}
      - {label: "Draft", name: "draft", widget: "boolean", default: true}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - {label: "SEO Title", name: "title", widget: "string", required: false}
          - {label: "SEO Description", name: "description", widget: "text", required: false}
      - {label: "Article Body", name: "body", widget: "markdown"}

  - name: "news_km"
    sortable_fields:
      - field: publishedAt
        label: "Published Date"
        default_sort: desc
      - title
    label: "News & Events - Khmer"
    folder: "src/content/news/km"
    create: true
    preview: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    fields:
      - {label: "Slug", name: "slug", widget: "string", hint: "Use the same slug as English."}
      - {label: "ចំណងជើង", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Language", name: "language", widget: "hidden", default: "km"}
      - {label: "Translation Key", name: "translationKey", widget: "string"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Published Date", name: "publishedAt", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
      - {label: "Event Date", name: "eventDate", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false}
      - {label: "Source Name", name: "sourceName", widget: "string"}
      - {label: "Source URL", name: "sourceUrl", widget: "string"}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false, hint: "Use WebP only."}
      - {label: "Draft", name: "draft", widget: "boolean", default: true}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - {label: "SEO Title", name: "title", widget: "string", required: false}
          - {label: "SEO Description", name: "description", widget: "text", required: false}
      - {label: "Article Body", name: "body", widget: "markdown"}
  - name: "knowledge_en"
    sortable_fields:
      - field: publishedAt
        label: "Published Date"
        default_sort: desc
      - title
    label: "Knowledge Center - English"
    folder: "src/content/knowledge"
    create: true
    preview: false
    extension: "mdx"
    format: "frontmatter"
    identifier_field: "slug"
    slug: "{{slug}}"
    media_folder: "/public/images/knowledge"
    public_folder: "/images/knowledge"
    fields:
      - {label: "Slug", name: "slug", widget: "string", hint: "Use lowercase English letters, numbers and hyphens. Khmer must use the matching English slug."}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Published Date", name: "publishedAt", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
      - {label: "Updated Date", name: "updatedAt", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false}
      - {label: "Language", name: "language", widget: "hidden", default: "en"}
      - {label: "Translation Key", name: "translationKey", widget: "string"}
      - {label: "Hero Image", name: "heroImage", widget: "image", hint: "Use WebP only."}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Reading Time (minutes)", name: "readingTime", widget: "number", value_type: "int"}
      - {label: "Related Products", name: "relatedProducts", widget: "list", required: false, default: []}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: true}
      - label: "SEO"
        name: "seo"
        widget: "object"
        fields:
          - {label: "SEO Title", name: "title", widget: "string", required: false}
          - {label: "SEO Description", name: "description", widget: "text", required: false}
          - {label: "SEO Keywords", name: "keywords", widget: "list", required: false}
          - {label: "Canonical URL", name: "canonical", widget: "string", required: false}
      - {label: "MDX Body", name: "body", widget: "text"}

  - name: "knowledge_km"
    sortable_fields:
      - field: publishedAt
        label: "Published Date"
        default_sort: desc
      - title
    label: "Knowledge Center - Khmer"
    folder: "src/content/knowledge/km"
    create: true
    preview: false
    extension: "mdx"
    format: "frontmatter"
    identifier_field: "slug"
    slug: "{{slug}}"
    media_folder: "/public/images/knowledge"
    public_folder: "/images/knowledge"
    fields:
      - {label: "Slug", name: "slug", widget: "string", hint: "Use lowercase English letters, numbers and hyphens. Khmer must use the matching English slug."}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Published Date", name: "publishedAt", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
      - {label: "Updated Date", name: "updatedAt", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false}
      - {label: "Language", name: "language", widget: "hidden", default: "km"}
      - {label: "Translation Key", name: "translationKey", widget: "string"}
      - {label: "Hero Image", name: "heroImage", widget: "image", hint: "Use WebP only."}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Reading Time (minutes)", name: "readingTime", widget: "number", value_type: "int"}
      - {label: "Related Products", name: "relatedProducts", widget: "list", required: false, default: []}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: true}
      - label: "SEO"
        name: "seo"
        widget: "object"
        fields:
          - {label: "SEO Title", name: "title", widget: "string", required: false}
          - {label: "SEO Description", name: "description", widget: "text", required: false}
          - {label: "SEO Keywords", name: "keywords", widget: "list", required: false}
          - {label: "Canonical URL", name: "canonical", widget: "string", required: false}
      - {label: "MDX Body", name: "body", widget: "text"}

  - name: "resources_en"
    sortable_fields:
      - field: publishDate
        label: "Published Date"
        default_sort: desc
      - title
    label: "Resources - English"
    folder: "src/content/resources"
    create: true
    preview: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "slug"
    slug: "{{slug}}"
    media_folder: "/public/images/resources"
    public_folder: "/images/resources"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Language", name: "language", widget: "hidden", default: "en"}
      - {label: "Translation Key", name: "translationKey", widget: "string", required: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Publish Date", name: "publishDate", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
      - {label: "Updated Date", name: "updatedDate", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false}
      - {label: "Author", name: "author", widget: "string", default: "Mato Cashew"}
      - {label: "Hero Image", name: "image", widget: "image", hint: "Use WebP only."}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Draft", name: "draft", widget: "boolean", default: true}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Reading Time", name: "readingTime", widget: "number", value_type: "int", required: false}
      - label: "Downloadable File (Excel / PDF)"
        name: "downloadFile"
        widget: "file"
        required: false
        media_folder: "/public/downloads/resources"
        public_folder: "/downloads/resources"
        media_library:
          config:
            multiple: false
      - {label: "Article Body", name: "body", widget: "markdown"}

  - name: "resources_km"
    sortable_fields:
      - field: publishDate
        label: "Published Date"
        default_sort: desc
      - title
    label: "Resources - Khmer"
    folder: "src/content/resources/km"
    create: true
    preview: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "slug"
    slug: "{{slug}}"
    media_folder: "/public/images/resources"
    public_folder: "/images/resources"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Language", name: "language", widget: "hidden", default: "km"}
      - {label: "Translation Key", name: "translationKey", widget: "string", required: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Publish Date", name: "publishDate", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
      - {label: "Updated Date", name: "updatedDate", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false}
      - {label: "Author", name: "author", widget: "string", default: "Mato Cashew"}
      - {label: "Hero Image", name: "image", widget: "image", hint: "Use WebP only."}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Draft", name: "draft", widget: "boolean", default: true}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Reading Time", name: "readingTime", widget: "number", value_type: "int", required: false}
      - label: "Downloadable File (Excel / PDF)"
        name: "downloadFile"
        widget: "file"
        required: false
        media_folder: "/public/downloads/resources"
        public_folder: "/downloads/resources"
        media_library:
          config:
            multiple: false
      - {label: "Article Body", name: "body", widget: "markdown"}

  # =========================================================
  # PRODUCTS — BILINGUAL (EN / KM)
  # =========================================================
  - name: "products"
    label: "Products — English / Khmer"
    label_singular: "Product"
    folder: "src/content/products"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    sortable_fields:
      - field: publishDate
        label: "Published Date"
        default_sort: desc
      - title
    fields:
      - {label: "Product Title (EN)", name: "title", widget: "string"}
      - {label: "Product Title (KM)", name: "titleKm", widget: "string", required: false}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "SKU", name: "sku", widget: "string"}

      - {label: "Description (EN)", name: "description", widget: "text"}
      - {label: "Description (KM)", name: "descriptionKm", widget: "text", required: false}

      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Retail", "Wholesale"]

      - {label: "Category (KM)", name: "categoryKm", widget: "string", required: false}
      - {label: "Weight", name: "weight", widget: "string"}
      - {label: "Packaging (EN)", name: "packaging", widget: "string"}
      - {label: "Packaging (KM)", name: "packagingKm", widget: "string", required: false}

      - {label: "Main Product Image", name: "image", widget: "image"}

      - label: "Product Gallery"
        name: "gallery"
        widget: "list"
        required: false

      - {label: "Featured Product", name: "featured", widget: "boolean", default: false}
      - {label: "Available for Wholesale", name: "availableForWholesale", widget: "boolean", default: true}
      - {label: "Private Label", name: "privateLabel", widget: "boolean", default: false}
      - {label: "Minimum Order", name: "minimumOrder", widget: "string", required: false}

      - label: "Specifications (EN)"
        name: "specifications"
        widget: "list"
        required: false

      - label: "Specifications (KM)"
        name: "specificationsKm"
        widget: "list"
        required: false

      - label: "Applications (EN)"
        name: "applications"
        widget: "list"
        required: false

      - label: "Applications (KM)"
        name: "applicationsKm"
        widget: "list"
        required: false

      - {label: "Publish Date", name: "publishDate", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
      - {label: "Updated Date", name: "updatedDate", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: true}
